{% extends 'base.html' %}

{% block title %} Password Reset Successful {% endblock %}

{% block content %}
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
    body {
        background-color: #F8FAFC;
        font-family: 'Segoe UI', Tahoma, sans-serif;
        color: #1E293B;
    }

    .message-wrapper {
        max-width: 500px;
        margin: 100px auto;
        background: rgba(255, 255, 255, 0.9);
        padding: 40px;
        border-radius: 20px;
        box-shadow: 0 8px 25px rgba(0, 119, 182, 0.15);
        border: 1px solid #E2E8F0;
        text-align: center;
    }

    .message-title {
        font-size: 1.5rem;
        font-weight: 600;
        color: #0077B6;
        margin-bottom: 20px;
    }

    .btn-primary {
        background-color: #00C49A;
        border-color: #00C49A;
        font-weight: 600;
        padding: 12px 24px;
        font-size: 16px;
        border-radius: 10px;
        transition: background 0.3s ease;
    }

    .btn-primary:hover {
        background-color: #009e84;
        border-color: #009e84;
    }
</style>

<div class="message-wrapper">
    <div class="message-title">✅ Password Reset Successful</div>
    <p>Your password has been reset successfully!</p>
    <a href="{% url 'login' %}" class="btn btn-primary mt-4">Go to Login</a>
</div>

{% endblock %}
