{% if messages %}
{% if inline %}
<div class="mt-6 space-y-2">
{% elif user.is_authenticated %}
<div class="mt-4 space-y-2 px-4 sm:px-6 lg:px-8">
{% else %}
<div class="page mt-4 space-y-2">
{% endif %}
    {% for message in messages %}
    <p
        class="message"
        data-level="{{ message.level_tag }}"
        {% if message.level_tag == "danger" %}role="alert"{% endif %}
    >
        {{ message }}
    </p>
    {% endfor %}
</div>
{% endif %}
