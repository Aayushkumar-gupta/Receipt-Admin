{% load static %}
{% with url=request.scheme|add:"://"|add:request.get_host|add:request.path description=description|default:"Create receipts for your sales, send buyers a PDF and keep every sale on record in one place." %}
<title>{{ title }}</title>
<meta name="description" content="{{ description }}">
<meta name="robots" content="{{ robots|default:'index, follow' }}">
<link rel="canonical" href="{{ url }}">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Receipt Admin">
<meta property="og:title" content="{{ title }}">
<meta property="og:description" content="{{ description }}">
<meta property="og:url" content="{{ url }}">
<meta property="og:image" content="{{ request.scheme }}://{{ request.get_host }}{% static 'receipts/og-image.jpg' %}">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
{% endwith %}
