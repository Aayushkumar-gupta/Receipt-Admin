<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title>Something went wrong | Receipt Admin</title>
    <style>
        body {
            margin: 0;
            background: #F8FAFC;
            color: #1E293B;
            font-family: system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
            font-size: 17px;
            line-height: 1.6;
        }

        header {
            border-bottom: 1px solid #CBD5E1;
            background: #FFFFFF;
            padding: 18px 24px;
            font-size: 22px;
            font-weight: 700;
        }

        main {
            max-width: 36rem;
            margin: 0 auto;
            padding: 72px 24px;
        }

        .code {
            margin: 0;
            color: #64748B;
            font-size: 15px;
            font-weight: 600;
        }

        h1 {
            margin: 8px 0 0;
            font-size: 32px;
            line-height: 1.2;
            letter-spacing: -0.02em;
        }

        p {
            margin: 16px 0 0;
            color: #475569;
        }

        .button {
            display: inline-block;
            margin-top: 32px;
            border-radius: 8px;
            background: #0077B6;
            padding: 12px 20px;
            color: #FFFFFF;
            font-weight: 600;
            text-decoration: none;
        }

        .button:hover {
            background: #005F92;
        }

        a:focus-visible {
            outline: 2px solid #0077B6;
            outline-offset: 3px;
        }

        .support a {
            color: #005F92;
        }
    </style>
</head>
<body>
    <header>
        <span style="color: #0077B6;">Receipt</span>
        <span style="color: #00866A;">Admin</span>
    </header>
    <main>
        <p class="code">500</p>
        <h1>Something went wrong on our side</h1>
        <p>The page could not load. Please try again in a few minutes.</p>
        <a href="/" class="button">Go to the home page</a>
        <p class="support">
            If it keeps happening, write to
            <a href="mailto:support@receiptadmin.com">support@receiptadmin.com</a>.
        </p>
    </main>
</body>
</html>
