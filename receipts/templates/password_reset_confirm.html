{% extends 'base.html' %}

{% block title %} Set New Password {% endblock %}

{% block content %}
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
    body {
        background-color: #F8FAFC;
        font-family: 'Segoe UI', Tahoma, sans-serif;
        color: #1E293B;
    }

    .form-wrapper {
        max-width: 500px;
        margin: 80px auto;
        background: rgba(255, 255, 255, 0.9);
        padding: 40px;
        border-radius: 20px;
        box-shadow: 0 8px 25px rgba(0, 119, 182, 0.15);
        border: 1px solid #E2E8F0;
    }

    .form-title {
        font-size: 1.5rem;
        font-weight: 600;
        color: #0077B6;
        margin-bottom: 25px;
        border-bottom: 2px solid #E2E8F0;
        padding-bottom: 8px;
        text-align: center;
    }

    .form-floating input {
        border-radius: 8px;
        border: 1px solid #CBD5E1;
        background: #ffffff;
    }

    .form-floating label {
        color: #475569;
    }

    .btn-primary {
        background-color: #00C49A;
        border-color: #00C49A;
        font-weight: 600;
        padding: 12px 24px;
        font-size: 16px;
        border-radius: 10px;
        transition: background 0.3s ease;
    }

    .btn-primary:hover {
        background-color: #009e84;
        border-color: #009e84;
    }
</style>

<div class="form-wrapper">
    <div class="form-title">🔒 Set a New Password</div>

    <form method="post" onsubmit="return validatePasswordForm()">
        {% csrf_token %}

        <div class="form-floating mb-1">
            <input type="password" name="new_password1" class="form-control" id="id_new_password1" placeholder="New password" required>
            <label for="id_new_password1">New password</label>
        </div>

        <small id="password1_error" class="text-danger"></small>

        <div class="form-floating mb-1 mt-3">
            <input type="password" name="new_password2" class="form-control" id="id_new_password2" placeholder="Confirm password" required>
            <label for="id_new_password2">Confirm password</label>
        </div>

        <small id="password2_error" class="text-danger"></small>

        <div class="text-center mt-3">
            <button type="submit" class="btn btn-primary w-100">Change Password</button>
        </div>
    </form>
</div>

<script>
function validatePasswordForm() {
    const pwd1 = document.getElementById("id_new_password1").value;
    const pwd2 = document.getElementById("id_new_password2").value;

    let errors = { pwd1: "", pwd2: "" };

    // Minimum length
    if (pwd1.length < 8) {
        errors.pwd1 += "Password must be at least 8 characters long.<br>";
    }

    // Uppercase
    if (!/[A-Z]/.test(pwd1)) {
        errors.pwd1 += "Password must contain at least one uppercase letter.<br>";
    }

    // Lowercase
    if (!/[a-z]/.test(pwd1)) {
        errors.pwd1 += "Password must contain at least one lowercase letter.<br>";
    }

    // Number
    if (!/\d/.test(pwd1)) {
        errors.pwd1 += "Password must contain at least one number.<br>";
    }

    // Special character
    if (!/[!@#$%^&*(),.?":{}|<>]/.test(pwd1)) {
        errors.pwd1 += "Password must contain at least one special character.<br>";
    }

    // Password match
    if (pwd1 !== pwd2) {
        errors.pwd2 = "Passwords do not match.";
    }

    // Show errors
    document.getElementById("password1_error").innerHTML = errors.pwd1;
    document.getElementById("password2_error").innerHTML = errors.pwd2;

    return errors.pwd1 === "" && errors.pwd2 === "";
}
</script>



{% endblock %}
