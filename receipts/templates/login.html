{% extends 'base.html' %}

{% block title %}Login{% endblock %}

{% block content %}
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
    body {
        background-color: #F8FAFC; /* solid light neutral background */
        font-family: 'Segoe UI', Tahoma, sans-serif;
        color: #1E293B;
    }

    /* Frosted glass form container */
    .form-wrapper {
        max-width: 480px;
        margin: 80px auto;
        background: rgba(255, 255, 255, 0.85);
        padding: 40px;
        border-radius: 20px;
        box-shadow: 0 8px 25px rgba(0, 119, 182, 0.15);
        border: 1px solid #E2E8F0;
    }

    .form-title {
        font-size: 1.5rem;
        font-weight: 600;
        color: #0077B6; /* clear trust-blue */
        margin-bottom: 25px;
        border-bottom: 2px solid #E2E8F0;
        padding-bottom: 8px;
        text-align: center;
    }

    .form-floating input {
        border-radius: 8px;
        border: 1px solid #CBD5E1;
        background: #ffffff;
    }

    .form-floating label {
        color: #475569;
    }

    .btn-primary {
        background-color: #00C49A; /* teal accent */
        border-color: #00C49A;
        font-weight: 600;
        padding: 12px 24px;
        font-size: 16px;
        border-radius: 10px;
        width: 100%;
        transition: background 0.3s ease;
    }

    .btn-primary:hover {
        background-color: #009e84;
        border-color: #009e84;
    }

    .btn-link {
        display: block;
        text-align: center;
        margin-top: 15px;
        color: #0077B6;
        font-weight: 600;
        text-decoration: none;
    }

    .btn-link:hover {
        text-decoration: underline;
    }

    .alert {
        margin-top: 10px;
    }
</style>

<div class="form-wrapper">
    <h2 class="form-title">Login</h2>
    <form method="POST" novalidate>
        {% csrf_token %}
        <div class="form-floating mb-3">
            <input type="text" name="username" class="form-control" id="username" placeholder="Email" required>
            <label for="username">Email</label>
        </div>

        <div class="form-floating mb-4">
            <input type="password" name="password" class="form-control" id="password" placeholder="Password" required>
            <label for="password">Password</label>
        </div>

        <button type="submit" class="btn btn-primary">Login</button>
    </form>

    <a href="{% url 'sign_up' %}" class="btn-link">Create Account</a>
    <a href="{% url 'password_reset' %}" class="btn-link">Forgot Password?</a>
</div>
{% endblock %}
