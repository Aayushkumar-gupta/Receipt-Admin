<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Receipt App{% endblock %}</title>

    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
   <nav class="navbar navbar-expand-lg navbar-light bg-light">
    <div class="container">
    <a class="navbar-brand" href="{% url 'home' %}">ClearSlip</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto">

        <li class="nav-item">
          <a class="nav-link" href="{% url 'home' %}">Home</a>
        </li>

        <li class="nav-item">
          <a class="nav-link" href="{% url 'create_receipt' %}">Create Receipt</a>
        </li>

        <li class="nav-item">
          <a class="nav-link" href="{% url 'my_receipts' %}">My Receipts</a>
        </li>

        <li class="nav-item">
          <a class="nav-link" href="{% url 'about' %}">About</a>
        </li>

        <!-- Example login/logout logic -->
        {% if user.is_authenticated %}
          <li class="nav-item">
            <a class="nav-link" href="">Logout</a>
          </li>
        {% else %}
          <li class="nav-item">
            <a class="nav-link" href="">Login</a>
          </li>
        {% endif %}

          <li class="nav-item">
            <a class="nav-link" href="{% url 'test' %}">Test</a>
          </li>
          
      </ul>
    </div>
  </div>
</nav>


    {% block content %}
    <!-- Page-specific content will appear here -->
    {% endblock %}
</body>
</html>
