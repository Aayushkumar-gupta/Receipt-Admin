{% extends 'base.html' %}

{% block title %} Receipt {% endblock %}

{% block content %}
<div class="container mt-5">
    <h3 class="mb-4">Receipt Form</h3>
    <form method="POST">
        {% csrf_token %}
        
        <div class="mb-3">
            <label for="buyerName" class="form-label">Buyer's Name</label>
            <input type="text" class="form-control" id="buyerName" name="buyer_name" placeholder="Enter buyer's name">
        </div>

        <div class="mb-3">
            <label for="buyerAddress" class="form-label">Buyer's Address</label>
            <input type="text" class="form-control" id="buyerAddress" name="buyer_address" placeholder="Enter buyer's address">
        </div>

        <div class="mb-3">
            <label for="buyerPhone" class="form-label">Buyer's Phone Number</label>
            <input type="number" class="form-control" id="buyerPhone" name="buyer_phone" placeholder="Enter phone number">
        </div>

        <div class="mb-3">
            <label for="purchaseDate" class="form-label">Date</label>
            <input type="date" class="form-control" id="purchaseDate" name="purchase_date">
        </div>

        <div class="mb-3">
            <label for="itemDescription" class="form-label">Item Description</label>
            <input type="text" class="form-control" id="itemDescription" name="item_description" placeholder="Describe the item">
        </div>

        <div class="mb-3">
            <label for="price" class="form-label">Price</label>
            <input type="number" class="form-control" id="price" name="price" placeholder="Enter price">
        </div>

        <button type="submit" class="btn btn-primary">Submit</button>
    </form>
</div>
{% endblock %}
