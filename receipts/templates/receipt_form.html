{% extends 'base.html' %}

{% block title %} Create Receipt {% endblock %}

{% block content %}
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
    body {
        background-color: #F8FAFC; /* solid light neutral background */
        font-family: 'Segoe UI', Tahoma, sans-serif;
        color: #1E293B; /* charcoal for readability */
    }

    /* Frosted glass form container */
    .form-wrapper {
        max-width: 960px;
        margin: 50px auto;
        background: rgba(255, 255, 255, 0.85);
        padding: 40px;
        border-radius: 20px;
        box-shadow: 0 8px 25px rgba(0, 119, 182, 0.15);
        border: 1px solid #E2E8F0;
    }

    .form-title {
        font-size: 1.5rem;
        font-weight: 600;
        color: #0077B6; /* clear trust-blue */
        margin-bottom: 25px;
        border-bottom: 2px solid #E2E8F0;
        padding-bottom: 8px;
    }

    .form-floating input,
    .form-floating textarea {
        border-radius: 8px;
        border: 1px solid #CBD5E1;
        background: #ffffff;
    }

    .form-floating label {
        color: #475569;
    }

    .btn-primary {
        background-color: #00C49A; /* teal accent */
        border-color: #00C49A;
        font-weight: 600;
        padding: 12px 24px;
        font-size: 16px;
        border-radius: 10px;
        transition: background 0.3s ease;
    }

    .btn-primary:hover {
        background-color: #009e84;
        border-color: #009e84;
    }

    .section-divider {
        margin-top: 40px;
    }

    .remove-btn {
        color: #EF4444; /* red accent for remove */
        cursor: pointer;
        font-size: 1.2rem;
    }
</style>

<div class="form-wrapper">
    <form method="POST" action="{% url 'create_receipt' %}" id = "js-createreceipt-form" onsubmit="prepareItems()">
        {% csrf_token %}

        <!-- Seller Information -->
        <div class="form-title">👤 Seller Information</div>
        <div class="row g-3">
            <div class="col-md-6 form-floating">
                <input type="text" class="form-control" name="seller_name" placeholder="Seller Name" required>
                <label>Seller's Name</label>
            </div>
            <div class="col-md-6 form-floating">
                <input type="text" class="form-control" name="seller_phone_number" id="js-seller_phone_number" placeholder="Seller Phone" required>
                <label>Seller's Phone</label>
            </div>
            <div class="col-md-6 form-floating">
                <input type="email" class="form-control" name="seller_email" id="js-seller_email" placeholder="Seller Email" required>
                <label>Seller's Email</label>
            </div>
            <div class="col-md-6 form-floating">
                <input type="text" class="form-control" name="seller_address" placeholder="Seller Address" required>
                <label>Seller's Address</label>
            </div>
        </div>

        <!-- Buyer Information -->
        <div class="form-title section-divider">🧾 Buyer Information</div>
        <div class="row g-3">
            <div class="col-md-6 form-floating">
                <input type="text" class="form-control" name="buyer_name" placeholder="Buyer Name" required>
                <label>Buyer's Name</label>
            </div>
            <div class="col-md-6 form-floating">
                <input type="text" class="form-control" name="buyer_phone_number" id="js-buyer_phone_number" placeholder="Buyer Phone" required>
                <label>Buyer's Phone</label>
            </div>
            <div class="col-md-6 form-floating">
                <input type="email" class="form-control" name="buyer_email" id="js-buyer_email" placeholder="Buyer Email" required>
                <label>Buyer's Email</label>
            </div>
            <div class="col-6 form-floating">
                <input type="text" class="form-control" name="buyer_address" placeholder="Buyer Address" required>
                <label>Buyer's Address</label>
            </div>
        </div>

        <!-- Item Information -->
        <div class="form-title section-divider">📦 Items</div>
        <div id="items-container">
            <div class="row g-3 item-row">
                <div class="col-md-5 form-floating">
                    <input type="text" class="form-control" name="description" placeholder="Description" required>
                    <label>Description</label>
                </div>
                <div class="col-md-2 form-floating">
                    <input type="number" min="0" step="1" class="form-control quantity" id="js-quantity" placeholder="Quantity" value="1" required>
                    <label>Qty</label>
                </div>
                <div class="col-md-2 form-floating">
                    <input type="number" min="0" step="0.01" class="form-control unit_price" id="js-unit-price" placeholder="Unit Price" value="0" required>
                    <label>Unit Price</label>
                </div>
                <div class="col-md-2 form-floating">
                    <input type="number" readonly class="form-control line_price" placeholder="Line Price" value="0" required>
                    <label>Line Price</label>
                </div>
                <div class="col-md-1 d-flex align-items-center">
                    <span class="remove-btn" onclick="removeItem(this)">&times;</span>
                </div>
            </div>
        </div>

        <button type="button" class="btn btn-outline-secondary mt-3" onclick="addItem()">+ Add Item</button>

        <!-- Pricing Information -->
        <div class="form-title section-divider">💰 Pricing Summary</div>
        <div class="row g-3">
            <div class="col-md-4 form-floating">
                <input type="number" readonly step="0.01" class="form-control" id="sub_total" name="sub_total" placeholder="Subtotal" required>
                <label>Subtotal</label>
            </div>
            <div class="col-md-4 form-floating">
                <input type="number" step="0.01" class="form-control" id="tax_rate" name="tax_rate" placeholder="Tax Rate" value="8.25" required>
                <label>Tax Rate (%)</label>
            </div>
            <div class="col-md-4 form-floating">
                <input type="number" readonly step="0.01" class="form-control" id="total_amount" name="total_amount" placeholder="Total Amount" required>
                <label>Total Amount</label>
            </div>
        </div>

        <input type="hidden" name="items" id="items-input">

        <div class="text-center mt-5">
            <button type="submit" class="btn btn-primary w-50">Generate Receipt</button>
        </div>
    </form>
</div>

<script>
function calculateTotals() {
    let subTotal = 0;
    document.querySelectorAll('.item-row').forEach(row => {
        const qty = parseFloat(row.querySelector('.quantity').value) || 0;
        const unitPrice = parseFloat(row.querySelector('.unit_price').value) || 0;
        const linePrice = qty * unitPrice;
        row.querySelector('.line_price').value = linePrice.toFixed(2);
        subTotal += linePrice;
    });

    const taxRate = parseFloat(document.getElementById('tax_rate').value) || 0;
    const taxAmount = subTotal * (taxRate / 100);
    const total = subTotal + taxAmount;

    document.getElementById('sub_total').value = subTotal.toFixed(2);
    document.getElementById('total_amount').value = total.toFixed(2);
}

function addItem() {
    const container = document.getElementById('items-container');
    const row = document.createElement('div');
    row.className = 'row g-3 item-row mt-2';
    row.innerHTML = `
        <div class="col-md-5 form-floating">
            <input type="text" class="form-control" name="description" placeholder="Description">
            <label>Description</label>
        </div>
        <div class="col-md-2 form-floating">
            <input type="number" min="0" step="1" class="form-control quantity" placeholder="Quantity" value="1">
            <label>Qty</label>
        </div>
        <div class="col-md-2 form-floating">
            <input type="number" min="0" step="0.01" class="form-control unit_price" placeholder="Unit Price" value="0">
            <label>Unit Price</label>
        </div>
        <div class="col-md-2 form-floating">
            <input type="number" readonly class="form-control line_price" placeholder="Line Price" value="0">
            <label>Line Price</label>
        </div>
        <div class="col-md-1 d-flex align-items-center">
            <span class="remove-btn" onclick="removeItem(this)">&times;</span>
        </div>
    `;
    container.appendChild(row);

    row.querySelector('.quantity').addEventListener('input', calculateTotals);
    row.querySelector('.unit_price').addEventListener('input', calculateTotals);
}

function removeItem(button) {
    button.closest('.item-row').remove();
    calculateTotals();
}

function prepareItems() {
    const items = [];
    document.querySelectorAll('.item-row').forEach(row => {
        items.push({
            description: row.querySelector('input[name="description"]').value,
            quantity: row.querySelector('.quantity').value,
            unit_price: row.querySelector('.unit_price').value
        });
    });
    document.getElementById('items-input').value = JSON.stringify(items);
    calculateTotals();
}

document.addEventListener('input', calculateTotals);
window.addEventListener('load', calculateTotals);

const form = document.getElementById('js-createreceipt-form');

form.addEventListener('submit', function(event){
    let isValid = true;

    // Required fields
    const requiredFields = [
        'js-seller_name', 'js-seller_phone_number', 'js-seller_email', 'js-seller_address',
        'js-buyer_name', 'js-buyer_phone_number', 'js-buyer_email', 'js-buyer_address',
        'js-item', 'js-quantity', 'js-unit-price'
    ];

    requiredFields.forEach(id => {
        const field = document.getElementById(id);
        field.style.borderColor = '';
        if(field.value.trim() === ''){
            field.style.borderColor = 'red';
            isValid = false;
        }
    });

    // Email validation
    const emailPattern = /^[^ ]+@[^ ]+\.[a-z]{2,}$/;
    ['js-seller_email', 'js-buyer_email'].forEach(id => {
        const emailField = document.getElementById(id);
        if(emailField.value.trim() !== '' && !emailPattern.test(emailField.value)){
            emailField.style.borderColor = 'red';
            isValid = false;
            alert("Invalid Email: " + emailField.value);
        }
    });

    // Phone validation
    const phonePattern = /^[0-9]{10,}$/;
    ['js-seller_phone_number', 'js-buyer_phone_number'].forEach(id => {
        const phoneField = document.getElementById(id);
        if(phoneField.value.trim() !== '' && !phonePattern.test(phoneField.value)){
            phoneField.style.borderColor = 'red';
            isValid = false;
            alert("Invalid Phone Number: " + phoneField.value);
        }
    });

    // Quantity & Price
    const qty = document.getElementById('js-quantity');
    const price = document.getElementById('js-unit-price');
    if(qty.value <= 0){
        qty.style.borderColor = 'red';
        isValid = false;
        alert("Quantity must be greater than 0");
    }
    if(price.value < 0){
        price.style.borderColor = 'red';
        isValid = false;
        alert("Unit Price cannot be negative");
    }

    // Force recalc totals before submission
    calculateTotals();
    document.getElementById('sub_total').setAttribute("readonly", true);
    document.getElementById('total_amount').setAttribute("readonly", true);

    if (!isValid) {
        event.preventDefault();
    }
});
</script>

{% endblock %}
