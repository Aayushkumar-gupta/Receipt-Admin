{% extends 'base.html' %}

{% block title %} Receipt {% endblock %}

{% block content %}
<!-- form.html -->
<form method="POST" action="{% url 'create_receipt' %}">
    {% csrf_token %}

    <div class="mb-3">
        <label for="buyerName" class="form-label">Buyer's Name</label>
        <input type="text" class="form-control" name="buyer_name">
    </div>

    <div class="mb-3">
        <label for="buyerAddress" class="form-label">Buyer's Address</label>
        <input type="text" class="form-control" name="buyer_address">
    </div>

    <div class="mb-3">
        <label for="buyerPhone" class="form-label">Buyer's Phone Number</label>
        <input type="text" class="form-control" name="buyer_phone_number">
    </div>

    <!-- No need for date if it's auto_now_add -->
    
    <div class="mb-3">
        <label for="itemDescription" class="form-label">Item Description</label>
        <input type="text" class="form-control" name="item_description">
    </div>

    <div class="mb-3">
        <label for="price" class="form-label">Price</label>
        <input type="number" step="0.01" class="form-control" name="amount">
    </div>

    <button type="submit" class="btn btn-primary">Submit</button>
</form>

{% endblock %}
