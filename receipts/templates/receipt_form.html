{% extends 'base.html' %}

{% block title %} Create Receipt {% endblock %}

{% block content %}
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
    body {
        background-color: #f0f2f5;
        font-family: 'Segoe UI', sans-serif;
    }

    .form-wrapper {
        max-width: 960px;
        margin: 50px auto;
        background: #fff;
        padding: 40px;
        border-radius: 15px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
    }

    .form-title {
        font-size: 1.5rem;
        font-weight: 600;
        color: #1f2d5a;
        margin-bottom: 25px;
        border-bottom: 2px solid #e0e0e0;
        padding-bottom: 8px;
    }

    .form-floating input,
    .form-floating textarea {
        border-radius: 8px;
    }

    .form-floating label {
        color: #555;
    }

    .btn-primary {
        background-color: #1f2d5a;
        border-color: #1f2d5a;
        font-weight: 600;
        padding: 12px 24px;
        font-size: 16px;
        border-radius: 8px;
    }

    .btn-primary:hover {
        background-color: #162447;
        border-color: #162447;
    }

    .section-divider {
        margin-top: 40px;
    }

    .remove-btn {
        color: red;
        cursor: pointer;
        font-size: 1.2rem;
    }
</style>

<div class="form-wrapper">
    <form method="POST" action="{% url 'create_receipt' %}" onsubmit="prepareItems()">
        {% csrf_token %}

        <!-- Seller Information -->
        <div class="form-title">👤 Seller Information</div>
        <div class="row g-3">
            <div class="col-md-6 form-floating">
                <input type="text" class="form-control" name="seller_name" placeholder="Seller Name">
                <label>Seller's Name</label>
            </div>
            <div class="col-md-6 form-floating">
                <input type="text" class="form-control" name="seller_phone_number" placeholder="Seller Phone">
                <label>Seller's Phone</label>
            </div>
            <div class="col-md-6 form-floating">
                <input type="email" class="form-control" name="seller_email" placeholder="Seller Email">
                <label>Seller's Email</label>
            </div>
            <div class="col-md-6 form-floating">
                <input type="text" class="form-control" name="seller_address" placeholder="Seller Address">
                <label>Seller's Address</label>
            </div>
        </div>

        <!-- Buyer Information -->
        <div class="form-title section-divider">🧾 Buyer Information</div>
        <div class="row g-3">
            <div class="col-md-6 form-floating">
                <input type="text" class="form-control" name="buyer_name" placeholder="Buyer Name">
                <label>Buyer's Name</label>
            </div>
            <div class="col-md-6 form-floating">
                <input type="text" class="form-control" name="buyer_phone_number" placeholder="Buyer Phone">
                <label>Buyer's Phone</label>
            </div>
            <div class="col-md-6 form-floating">
                <input type="email" class="form-control" name="buyer_email" placeholder="Buyer Email">
                <label>Buyer's Email</label>
            </div>
            <div class="col-6 form-floating">
                <input type="text" class="form-control" name="buyer_address" placeholder="Buyer Address">
                <label>Buyer's Address</label>
            </div>
        </div>

        <!-- Item Information -->
        <div class="form-title section-divider">📦 Items</div>
        <div id="items-container">
            <div class="row g-3 item-row">
                <div class="col-md-5 form-floating">
                    <input type="text" class="form-control" name="description" placeholder="Description">
                    <label>Description</label>
                </div>
                <div class="col-md-2 form-floating">
                    <input type="number" min="0" step="1" class="form-control quantity" placeholder="Quantity" value="1">
                    <label>Qty</label>
                </div>
                <div class="col-md-2 form-floating">
                    <input type="number" min="0" step="0.01" class="form-control unit_price" placeholder="Unit Price" value="0">
                    <label>Unit Price</label>
                </div>
                <div class="col-md-2 form-floating">
                    <input type="number" readonly class="form-control line_price" placeholder="Line Price" value="0">
                    <label>Line Price</label>
                </div>
                <div class="col-md-1 d-flex align-items-center">
                    <span class="remove-btn" onclick="removeItem(this)">&times;</span>
                </div>
            </div>
        </div>

        <button type="button" class="btn btn-outline-secondary mt-3" onclick="addItem()">+ Add Item</button>

        <!-- Pricing Information -->
        <div class="form-title section-divider">💰 Pricing Summary</div>
        <div class="row g-3">
            <div class="col-md-4 form-floating">
                <input type="number" readonly step="0.01" class="form-control" id="sub_total" name="sub_total" placeholder="Subtotal">
                <label>Subtotal</label>
            </div>
            <div class="col-md-4 form-floating">
                <input type="number" step="0.01" class="form-control" id="tax_rate" name="tax_rate" placeholder="Tax Rate" value="8.25">
                <label>Tax Rate (%)</label>
            </div>
            <div class="col-md-4 form-floating">
                <input type="number" readonly step="0.01" class="form-control" id="total_amount" name="total_amount" placeholder="Total Amount">
                <label>Total Amount</label>
            </div>
        </div>

        <!-- Hidden field to hold JSON items -->
        <input type="hidden" name="items" id="items-input">

        <!-- Submit Button -->
        <div class="text-center mt-5">
            <button type="submit" class="btn btn-primary w-50">Generate Receipt</button>
        </div>
    </form>
</div>

<script>
function calculateTotals() {
    let subTotal = 0;
    document.querySelectorAll('.item-row').forEach(row => {
        const qty = parseFloat(row.querySelector('.quantity').value) || 0;
        const unitPrice = parseFloat(row.querySelector('.unit_price').value) || 0;
        const linePrice = qty * unitPrice;
        row.querySelector('.line_price').value = linePrice.toFixed(2);
        subTotal += linePrice;
    });

    const taxRate = parseFloat(document.getElementById('tax_rate').value) || 0;
    const taxAmount = subTotal * (taxRate / 100);
    const total = subTotal + taxAmount;

    document.getElementById('sub_total').value = subTotal.toFixed(2);
    document.getElementById('total_amount').value = total.toFixed(2);
}

function addItem() {
    const container = document.getElementById('items-container');
    const row = document.createElement('div');
    row.className = 'row g-3 item-row mt-2';
    row.innerHTML = `
        <div class="col-md-5 form-floating">
            <input type="text" class="form-control" name="description" placeholder="Description">
            <label>Description</label>
        </div>
        <div class="col-md-2 form-floating">
            <input type="number" min="0" step="1" class="form-control quantity" placeholder="Quantity" value="1">
            <label>Qty</label>
        </div>
        <div class="col-md-2 form-floating">
            <input type="number" min="0" step="0.01" class="form-control unit_price" placeholder="Unit Price" value="0">
            <label>Unit Price</label>
        </div>
        <div class="col-md-2 form-floating">
            <input type="number" readonly class="form-control line_price" placeholder="Line Price" value="0">
            <label>Line Price</label>
        </div>
        <div class="col-md-1 d-flex align-items-center">
            <span class="remove-btn" onclick="removeItem(this)">&times;</span>
        </div>
    `;
    container.appendChild(row);

    row.querySelector('.quantity').addEventListener('input', calculateTotals);
    row.querySelector('.unit_price').addEventListener('input', calculateTotals);
}

function removeItem(button) {
    button.closest('.item-row').remove();
    calculateTotals();
}

function prepareItems() {
    const items = [];
    document.querySelectorAll('.item-row').forEach(row => {
        items.push({
            description: row.querySelector('input[name="description"]').value,
            quantity: row.querySelector('.quantity').value,
            unit_price: row.querySelector('.unit_price').value
        });
    });
    document.getElementById('items-input').value = JSON.stringify(items);
    calculateTotals();
}

document.addEventListener('input', calculateTotals);
window.addEventListener('load', calculateTotals);
</script>

{% endblock %}
