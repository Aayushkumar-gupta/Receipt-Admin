{% extends 'base.html' %}

{% block title %} Create Receipt {% endblock %}

{% block content %}
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
    body {
        background-color: #f0f2f5;
        font-family: 'Segoe UI', sans-serif;
    }

    .form-wrapper {
        max-width: 960px;
        margin: 50px auto;
        background: #fff;
        padding: 40px;
        border-radius: 15px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
    }

    .form-title {
        font-size: 1.5rem;
        font-weight: 600;
        color: #1f2d5a;
        margin-bottom: 25px;
        border-bottom: 2px solid #e0e0e0;
        padding-bottom: 8px;
    }

    .form-floating input,
    .form-floating textarea {
        border-radius: 8px;
    }

    .form-floating label {
        color: #555;
    }

    .btn-primary {
        background-color: #1f2d5a;
        border-color: #1f2d5a;
        font-weight: 600;
        padding: 12px 24px;
        font-size: 16px;
        border-radius: 8px;
    }

    .btn-primary:hover {
        background-color: #162447;
        border-color: #162447;
    }

    .section-divider {
        margin-top: 40px;
    }
</style>

<div class="form-wrapper">
    <form method="POST" action="{% url 'create_receipt' %}">
        {% csrf_token %}

        <!-- Seller Information -->
        <div class="form-title">👤 Seller Information</div>
        <div class="row g-3">
            <div class="col-md-6 form-floating">
                <input type="text" class="form-control" name="seller_name" placeholder="Seller Name">
                <label>Seller's Name</label>
            </div>
            <div class="col-md-6 form-floating">
                <input type="text" class="form-control" name="seller_phone_number" placeholder="Seller Phone">
                <label>Seller's Phone</label>
            </div>
            <div class="col-md-6 form-floating">
                <input type="email" class="form-control" name="seller_email" placeholder="Seller Email">
                <label>Seller's Email</label>
            </div>
            <div class="col-md-6 form-floating">
                <input type="text" class="form-control" name="seller_address" placeholder="Seller Address">
                <label>Seller's Address</label>
            </div>
        </div>

        <!-- Buyer Information -->
        <div class="form-title section-divider">🧾 Buyer Information</div>
        <div class="row g-3">
            <div class="col-md-6 form-floating">
                <input type="text" class="form-control" name="buyer_name" placeholder="Buyer Name">
                <label>Buyer's Name</label>
            </div>
            <div class="col-md-6 form-floating">
                <input type="text" class="form-control" name="buyer_phone_number" placeholder="Buyer Phone">
                <label>Buyer's Phone</label>
            </div>
            <div class="col-12 form-floating">
                <input type="text" class="form-control" name="buyer_address" placeholder="Buyer Address">
                <label>Buyer's Address</label>
            </div>
        </div>

        <!-- Item Information -->
        <div class="form-title section-divider">📦 Item Information</div>
        <div class="row g-3">
            <div class="col-12 form-floating">
                <textarea class="form-control" name="item_description" placeholder="Item Description" style="height: 100px;"></textarea>
                <label>Item Description</label>
            </div>
            <div class="col-md-4 form-floating">
                <input type="text" class="form-control" name="item_quantity" placeholder="Quantity">
                <label>Quantity</label>
            </div>
            <div class="col-md-4 form-floating">
                <input type="text" class="form-control" name="unit_price" placeholder="Unit Price">
                <label>Unit Price</label>
            </div>
            <div class="col-md-4 form-floating">
                <input type="text" class="form-control" name="line_price" placeholder="Line Price">
                <label>Line Price</label>
            </div>
        </div>

        <!-- Pricing Information -->
        <div class="form-title section-divider">💰 Pricing Summary</div>
        <div class="row g-3">
            <div class="col-md-4 form-floating">
                <input type="number" step="0.01" class="form-control" name="sub_total" placeholder="Subtotal">
                <label>Subtotal</label>
            </div>
            <div class="col-md-4 form-floating">
                <input type="text" class="form-control" name="tax_rate" placeholder="Tax Rate">
                <label>Tax Rate (%)</label>
            </div>
            <div class="col-md-4 form-floating">
                <input type="text" class="form-control" name="total_amount" placeholder="Total Amount">
                <label>Total Amount</label>
            </div>
        </div>

        <!-- Submit Button -->
        <div class="text-center mt-5">
            <button type="submit" class="btn btn-primary w-50">Generate Receipt</button>
        </div>
    </form>
</div>

{% endblock %}
