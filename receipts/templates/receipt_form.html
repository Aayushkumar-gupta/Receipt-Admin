{% extends 'base.html' %}

{% block title %} CreateReceipt {% endblock %}

{% block content %}
<style>
    body {
        background-color: #F5F7FA;
        color: #333333;
    }

    form {
        max-width: 600px;
        margin: 40px auto;
        padding: 30px;
        background-color: #FFFFFF;
        border: 1px solid #E5E7EB;
        border-radius: 10px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
    }

    label {
        font-weight: 600;
    }

    .form-control {
        border: 1px solid #E5E7EB;
        border-radius: 6px;
        padding: 10px;
        font-size: 16px;
    }

    .form-control:focus {
        border-color: #3ABEF9;
        box-shadow: 0 0 0 2px rgba(58, 190, 249, 0.2);
    }

    .btn-primary {
        background-color: #1F2D5A;
        border-color: #1F2D5A;
        font-weight: 600;
        padding: 10px 20px;
        border-radius: 6px;
        transition: background-color 0.3s ease;
    }

    .btn-primary:hover {
        background-color: #162447;
        border-color: #162447;
    }
</style>

<form method="POST" action="{% url 'create_receipt' %}">
    {% csrf_token %}

    <div class="mb-3">
        <label for="buyerName" class="form-label">Buyer's Name</label>
        <input type="text" class="form-control" name="buyer_name">
    </div>

    <div class="mb-3">
        <label for="buyerAddress" class="form-label">Buyer's Address</label>
        <input type="text" class="form-control" name="buyer_address">
    </div>

    <div class="mb-3">
        <label for="buyerPhone" class="form-label">Buyer's Phone Number</label>
        <input type="text" class="form-control" name="buyer_phone_number">
    </div>

    <div class="mb-3">
        <label for="itemDescription" class="form-label">Item Description</label>
        <input type="text" class="form-control" name="item_description">
    </div>

    <div class="mb-3">
        <label for="price" class="form-label">Price</label>
        <input type="number" step="0.01" class="form-control" name="amount">
    </div>

    <button type="submit" class="btn btn-primary">Submit</button>
</form>
{% endblock %}
