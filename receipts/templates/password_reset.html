{% extends 'base.html' %}

{% block seo %}{% include "partials/seo.html" with title="Reset your password | Receipt Admin" robots="noindex" %}{% endblock %}

{% block content %}

<style>
    body {
        background-color: #F8FAFC; /* solid light neutral background */
        font-family: 'Segoe UI', Tahoma, sans-serif;
        color: #1E293B; /* charcoal for readability */
    }

    .form-wrapper {
        max-width: 500px;
        margin: 80px auto;
        background: rgba(255, 255, 255, 0.9);
        padding: 40px;
        border-radius: 20px;
        box-shadow: 0 8px 25px rgba(0, 119, 182, 0.15);
        border: 1px solid #E2E8F0;
    }

    .form-title {
        font-size: 1.5rem;
        font-weight: 600;
        color: #0077B6; /* clear trust-blue */
        margin-bottom: 25px;
        border-bottom: 2px solid #E2E8F0;
        padding-bottom: 8px;
        text-align: center;
    }

    .form-floating input {
        border-radius: 8px;
        border: 1px solid #CBD5E1;
        background: #ffffff;
    }

    .form-floating label {
        color: #475569;
    }

    .btn-primary {
        background-color: #00C49A; /* teal accent */
        border-color: #00C49A;
        font-weight: 600;
        padding: 12px 24px;
        font-size: 16px;
        border-radius: 10px;
        transition: background 0.3s ease;
    }

    .btn-primary:hover {
        background-color: #009e84;
        border-color: #009e84;
    }
</style>

<div class="form-wrapper">
    <div class="form-title">🔑 Forgot Your Password?</div>
    <p class="text-center text-muted mb-4">Enter your email to reset your password.</p>
    <form method="post">
        {% csrf_token %}
        <div class="form-floating mb-3">
            <input type="email" name="email" class="form-control" id="id_email" placeholder="Email address" required>
            <label for="id_email">Email address</label>
        </div>
        <div class="text-center">
            <button type="submit" class="btn btn-primary w-100">Reset Password</button>
        </div>
    </form>
</div>

{% endblock %}
