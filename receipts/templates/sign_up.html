{% extends 'base.html' %}

{% block title %}Sign Up{% endblock %}

{% block content %}
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">

<style>
    body {
        background-color: #F8FAFC; 
        font-family: 'Segoe UI', Tahoma, sans-serif;
        color: #1E293B;
    }

    .form-wrapper {
        max-width: 480px;
        margin: 80px auto;
        background: rgba(255, 255, 255, 0.85);
        padding: 40px;
        border-radius: 20px;
        box-shadow: 0 8px 25px rgba(0, 119, 182, 0.15);
        border: 1px solid #E2E8F0;
    }

    .form-title {
        font-size: 1.5rem;
        font-weight: 600;
        color: #0077B6;
        margin-bottom: 25px;
        border-bottom: 2px solid #E2E8F0;
        padding-bottom: 8px;
        text-align: center;
    }

    .form-floating input {
        border-radius: 8px;
        border: 1px solid #CBD5E1;
        background: #ffffff;
    }

    .form-floating label {
        color: #475569;
    }

    .btn-success {
        background-color: #00C49A; 
        border-color: #00C49A;
        font-weight: 600;
        padding: 12px 24px;
        font-size: 16px;
        border-radius: 10px;
        width: 100%;
        transition: background 0.3s ease;
    }

    .btn-success:hover {
        background-color: #009e84;
        border-color: #009e84;
    }

    .btn-link {
        display: block;
        text-align: center;
        margin-top: 15px;
        color: #0077B6;
        font-weight: 600;
        text-decoration: none;
    }

    .btn-link:hover {
        text-decoration: underline;
    }

    .alert {
        margin-top: 10px;
    }

    /* Eye icon */
    .toggle-password {
        position: absolute;
        top: 50%;
        right: 10px;
        transform: translateY(-50%);
        border: none;
        background: none;
        cursor: pointer;
        color: #475569;
        font-size: 1.2rem;
    }
</style>

<div class="form-wrapper">
    <h2 class="form-title">Sign Up</h2>

    <form method="POST" id="js-signup-form" novalidate>
        {% csrf_token %}

        <div class="form-floating mb-3">
            <input type="text" name="first_name" class="form-control" id="first_name" placeholder="First Name" required>
            <label for="first_name">First Name</label>
        </div>

        <div class="form-floating mb-3">
            <input type="text" name="last_name" class="form-control" id="last_name" placeholder="Last Name" required>
            <label for="last_name">Last Name</label>
        </div>

        <div class="form-floating mb-3">
            <input type="text" name="phonenumber" class="form-control" id="phonenumber" placeholder="Phone Number" required>
            <label for="phonenumber">Phone Number</label>
        </div>

        <div class="form-floating mb-3">
            <input type="email" name="email" class="form-control" id="email" placeholder="Email" required>
            <label for="email">Email</label>
        </div>

        <div class="form-floating mb-3 position-relative">
            <input type="password" name="password" class="form-control" id="password" placeholder="Password" required>
            <label for="password">Password</label>
            <button type="button" class="toggle-password" onclick="togglePassword('password', this)">
                <i class="bi bi-eye"></i>
            </button>
        </div>

        <div class="form-floating mb-4 position-relative">
            <input type="password" name="confirm_password" class="form-control" id="confirm_password" placeholder="Confirm Password" required>
            <label for="confirm_password">Re-enter Your Password</label>
            <button type="button" class="toggle-password" onclick="togglePassword('confirm_password', this)">
                <i class="bi bi-eye"></i>
            </button>
        </div>

        <button type="submit" class="btn btn-success">Sign Up</button>
    </form>

    <a href="{% url 'login' %}" class="btn-link">Back to Login</a>
</div>

<script>
    const form = document.getElementById('js-signup-form');

    form.addEventListener('submit', function(event){
        let isValid = true;
        const firstname = document.getElementById('first_name');
        const lastname = document.getElementById('last_name');
        const phone = document.getElementById('phonenumber');
        const email = document.getElementById('email');
        const password = document.getElementById('password');
        const confirmPassword = document.getElementById('confirm_password');

        let inputs = [firstname, lastname, phone, email, password, confirmPassword];

        // Reset borders
        inputs.forEach(input => input.style.borderColor = '');

        // Check empty fields
        inputs.forEach(input => {
            if(input.value.trim() === ''){
                input.style.borderColor = 'red';
                isValid = false;
            }
        });

        // Email validation
        const emailPattern = /^[^ ]+@[^ ]+\.[a-z]{2,3}$/;
        if(!emailPattern.test(email.value)){
            email.style.borderColor = 'red';
            isValid = false;
            alert("Invalid Email Format!");
        }

        // Phone validation
        const phonePattern = /^[0-9]{10,}$/;
        if(!phonePattern.test(phone.value)){
            phone.style.borderColor = 'red';
            isValid = false;
            alert('Invalid Phone Number!');
        }

        // Password validation
        const passwordPattern = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&]).{8,}$/;
        if (!passwordPattern.test(password.value)) {
            password.style.borderColor = 'red';
            isValid = false;
            alert('Your password must be at least 8 characters long, contain at least one uppercase letter, one lowercase letter, one number, and one special character.');
        }

        // Confirm password match
        if (password.value !== confirmPassword.value) {
            confirmPassword.style.borderColor = 'red';
            isValid = false;
            alert('The Passwords Do not Match!');
        }

        if (!isValid) {
            event.preventDefault();
        }
    });

    function togglePassword(inputId, btn) {
        const input = document.getElementById(inputId);
        const icon = btn.querySelector('i');
        if (input.type === "password") {
            input.type = "text";
            icon.classList.remove('bi-eye');
            icon.classList.add('bi-eye-slash');
        } else {
            input.type = "password";
            icon.classList.remove('bi-eye-slash');
            icon.classList.add('bi-eye');
        }
    }
</script>
{% endblock %}
