{% extends 'base.html' %}

{% block title %}Edit receipt | Receipt Admin{% endblock %}
{% block robots %}noindex{% endblock %}

{% block content %}

<style>
    body {
        background-color: #F8FAFC;
        font-family: 'Segoe UI', Tahoma, sans-serif;
        color: #1E293B;
    }

    .form-wrapper {
        max-width: 960px;
        margin: 50px auto;
        background: rgba(255, 255, 255, 0.85);
        padding: 40px;
        border-radius: 20px;
        box-shadow: 0 8px 25px rgba(0, 119, 182, 0.15);
        border: 1px solid #E2E8F0;
    }

    .form-title {
        font-size: 1.5rem;
        font-weight: 600;
        color: #0077B6;
        margin-bottom: 25px;
        border-bottom: 2px solid #E2E8F0;
        padding-bottom: 8px;
    }

    .form-floating input,
    .form-floating textarea {
        border-radius: 8px;
        border: 1px solid #CBD5E1;
        background: #ffffff;
    }

    .form-floating label {
        color: #475569;
    }

    .btn-primary {
        background-color: #00C49A;
        border-color: #00C49A;
        font-weight: 600;
        padding: 12px 24px;
        font-size: 16px;
        border-radius: 10px;
        transition: background 0.3s ease;
    }

    .btn-primary:hover {
        background-color: #009e84;
        border-color: #009e84;
    }

    .btn-secondary {
        border-radius: 10px;
        font-weight: 600;
        padding: 12px 24px;
    }

    .section-divider {
        margin-top: 40px;
    }

    .remove-btn {
        color: #EF4444;
        cursor: pointer;
        font-size: 1.2rem;
    }

    .item-row + .item-row {
        margin-top: 10px;
    }
</style>

<div class="form-wrapper">
    <form method="POST" action="{% url 'staging_edit' receipt.id %}" id="js-editreceipt-form" onsubmit="prepareItems()">
        {% csrf_token %}

        <!-- Buyer Information -->
        <div class="form-title">🧾 Buyer Information</div>
        <div class="row g-3">
            <div class="col-md-6 form-floating">
                <input type="text" class="form-control" id="js-buyer_name" name="buyer_name" value="{{ receipt.buyer_name }}" required>
                <label>Buyer's Name</label>
            </div>
            <div class="col-md-6 form-floating">
                <input type="text" class="form-control" id="js-buyer_phone_number" name="buyer_phone_number" value="{{ receipt.buyer_phone_number }}" required>
                <label>Buyer's Phone</label>
            </div>
            <div class="col-md-6 form-floating">
                <input type="email" class="form-control" id="js-buyer_email" name="buyer_email" value="{% if receipt.buyer_email != 'N/A' %}{{ receipt.buyer_email }}{% endif %}">
                <label>Buyer's Email</label>
            </div>
            <div class="col-md-6 form-floating">
                <input type="text" class="form-control" id="js-buyer_address" name="buyer_address" value="{% if receipt.buyer_address != 'N/A' %}{{ receipt.buyer_address }}{% endif %}">
                <label>Buyer's Address</label>
            </div>
        </div>

        <!-- Item Information -->
        <div class="form-title section-divider">📦 Items</div>
        <div id="items-container"></div>
        <button type="button" class="btn btn-outline-secondary mt-3" onclick="addItem()">+ Add Item</button>

        <!-- Pricing Information -->
        <div class="form-title section-divider">💰 Pricing Summary</div>
        <div class="row g-3">
            <div class="col-md-4 form-floating">
                <input type="number" readonly step="0.01" class="form-control" id="sub_total" name="sub_total" value="{{ receipt.sub_total }}" required>
                <label>Subtotal</label>
            </div>
            <div class="col-md-4 form-floating">
                <input type="number" step="0.01" class="form-control" id="tax_rate" name="tax_rate" value="{{ receipt.tax_rate }}" required>
                <label>Tax Rate (%)</label>
            </div>
            <div class="col-md-4 form-floating">
                <input type="number" readonly step="0.01" class="form-control" id="total_amount" name="total_amount" value="{{ receipt.total_amount }}" required>
                <label>Total Amount</label>
            </div>
        </div>

        <input type="hidden" name="items" id="items-input">

        <div class="text-center mt-5">
            <a href="{% url 'staging_area' %}" class="btn btn-secondary w-25 me-2">Cancel</a>
            <button type="submit" class="btn btn-primary w-50">Save Changes</button>
        </div>
    </form>
</div>

{{ items|json_script:"items-data" }}

<script>
function calculateTotals() {
    let subTotal = 0;
    document.querySelectorAll('.item-row').forEach(row => {
        const qty = parseFloat(row.querySelector('.quantity').value) || 0;
        const unitPrice = parseFloat(row.querySelector('.unit_price').value) || 0;
        const linePrice = qty * unitPrice;
        row.querySelector('.line_price').value = linePrice.toFixed(2);
        subTotal += linePrice;
    });
    const taxRate = parseFloat(document.getElementById('tax_rate').value) || 0;
    const total = subTotal + subTotal * (taxRate / 100);
    document.getElementById('sub_total').value = subTotal.toFixed(2);
    document.getElementById('total_amount').value = total.toFixed(2);
}

function addItem(item = {description: "", quantity: 1, unit_price: 0}) {
    const container = document.getElementById('items-container');
    const row = document.createElement('div');
    row.className = 'row g-3 item-row mt-2';
    row.innerHTML = `
        <div class="col-md-5 form-floating">
            <input type="text" class="form-control js-item" name="description" placeholder="Description" required>
            <label>Description</label>
        </div>
        <div class="col-md-2 form-floating">
            <input type="number" min="1" step="1" class="form-control quantity" placeholder="Quantity" required>
            <label>Qty</label>
        </div>
        <div class="col-md-2 form-floating">
            <input type="number" min="0" step="0.01" class="form-control unit_price" placeholder="Unit Price" required>
            <label>Unit Price</label>
        </div>
        <div class="col-md-2 form-floating">
            <input type="number" readonly class="form-control line_price" placeholder="Line Price" value="0" required>
            <label>Line Price</label>
        </div>
        <div class="col-md-1 d-flex align-items-center">
            <span class="remove-btn" onclick="removeItem(this)">&times;</span>
        </div>
    `;
    // Set values via the DOM (not innerHTML) so user text can't inject HTML
    row.querySelector('input[name="description"]').value = item.description;
    row.querySelector('.quantity').value = item.quantity;
    row.querySelector('.unit_price').value = item.unit_price;
    container.appendChild(row);
    row.querySelector('.quantity').addEventListener('input', calculateTotals);
    row.querySelector('.unit_price').addEventListener('input', calculateTotals);
    calculateTotals();
}

function removeItem(button) {
    button.closest('.item-row').remove();
    calculateTotals();
}

function prepareItems() {
    const items = [];
    document.querySelectorAll('.item-row').forEach(row => {
        items.push({
            description: row.querySelector('input[name="description"]').value,
            quantity: row.querySelector('.quantity').value,
            unit_price: row.querySelector('.unit_price').value
        });
    });
    document.getElementById('items-input').value = JSON.stringify(items);
    calculateTotals();
}

document.addEventListener("DOMContentLoaded", () => {
    const existingItems = JSON.parse(document.getElementById("items-data").textContent);
    existingItems.forEach(item => addItem(item));
    calculateTotals();
});

// Validation
const form = document.getElementById('js-editreceipt-form');
form.addEventListener('submit', function(event){
    let isValid = true;

    const emailPattern = /^[^ ]+@[^ ]+\.[a-z]{2,}$/;
    const phonePattern = /^[0-9]{10,}$/;

    const buyerEmailField = document.getElementById('js-buyer_email');
    if(buyerEmailField.value.trim() !== '' && !emailPattern.test(buyerEmailField.value)){
        buyerEmailField.style.borderColor = 'red';
        alert("Invalid Email: " + buyerEmailField.value);
        isValid = false;
    } else buyerEmailField.style.borderColor = '';

    const buyerPhoneField = document.getElementById('js-buyer_phone_number');
    if(buyerPhoneField.value.trim() !== '' && !phonePattern.test(buyerPhoneField.value)){
        buyerPhoneField.style.borderColor = 'red';
        alert("Invalid Phone Number: " + buyerPhoneField.value);
        isValid = false;
    } else buyerPhoneField.style.borderColor = '';

    document.querySelectorAll('.quantity').forEach(qty => {
        if(qty.value <= 0){
            qty.style.borderColor = 'red';
            alert("Quantity must be greater than 0");
            isValid = false;
        } else qty.style.borderColor = '';
    });

    document.querySelectorAll('.unit_price').forEach(price => {
        if(price.value < 0){
            price.style.borderColor = 'red';
            alert("Unit Price cannot be negative");
            isValid = false;
        } else price.style.borderColor = '';
    });

    calculateTotals();
    if(!isValid) event.preventDefault();
});
</script>
{% endblock %}
