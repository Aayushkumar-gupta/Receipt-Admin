<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Verify Phone</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
        background-color: #F8FAFC; /* neutral light background */
        font-family: 'Segoe UI', Tahoma, sans-serif;
        color: #1E293B;
    }

    /* Frosted glass form container */
    .form-wrapper {
        max-width: 600px;
        margin: 80px auto;
        background: rgba(255, 255, 255, 0.9);
        padding: 40px;
        border-radius: 20px;
        box-shadow: 0 8px 25px rgba(0, 119, 182, 0.15);
        border: 1px solid #E2E8F0;
    }

    .form-title {
        font-size: 1.5rem;
        font-weight: 600;
        color: #0077B6;
        margin-bottom: 25px;
        border-bottom: 2px solid #E2E8F0;
        padding-bottom: 8px;
    }

    .form-floating input {
        border-radius: 8px;
        border: 1px solid #CBD5E1;
        background: #ffffff;
    }

    .form-floating label {
        color: #475569;
    }

    .btn-primary {
        background-color: #00C49A;
        border-color: #00C49A;
        font-weight: 600;
        padding: 12px 24px;
        font-size: 16px;
        border-radius: 10px;
        transition: background 0.3s ease;
    }

    .btn-primary:hover {
        background-color: #009e84;
        border-color: #009e84;
    }

    .text-note {
        font-size: 0.9rem;
        color: #475569;
        margin-bottom: 20px;
    }
  </style>
</head>
<body>

<div class="form-wrapper">
    <div class="form-title">📱 Verify Phone</div>
    <p class="text-note">Enter the OTP sent to your registered phone number to verify your account.</p>
    
    <form method="post">
        {% csrf_token %}
        <div class="form-floating mb-3">
            <input type="text" class="form-control" name="otp" placeholder="Enter OTP" required>
            <label>Enter OTP</label>
        </div>
        <div class="text-center">
            <button type="submit" class="btn btn-primary w-50">Verify</button>
        </div>
    </form>
</div>

</body>
</html>
