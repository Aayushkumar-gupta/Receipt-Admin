{% extends 'base.html' %}

{% block seo %}{% include "partials/seo.html" with title="Check your email | Receipt Admin" robots="noindex" %}{% endblock %}

{% block content %}

<style>
    body {
        background-color: #F8FAFC; /* solid light neutral background */
        font-family: 'Segoe UI', Tahoma, sans-serif;
        color: #1E293B; /* charcoal for readability */
    }

    .message-wrapper {
        max-width: 500px;
        margin: 100px auto;
        background: rgba(255, 255, 255, 0.9);
        padding: 40px;
        border-radius: 20px;
        box-shadow: 0 8px 25px rgba(0, 119, 182, 0.15);
        border: 1px solid #E2E8F0;
        text-align: center;
    }

    .message-title {
        font-size: 1.5rem;
        font-weight: 600;
        color: #0077B6;
        margin-bottom: 20px;
    }

    .btn-primary {
        background-color: #00C49A;
        border-color: #00C49A;
        font-weight: 600;
        padding: 12px 24px;
        font-size: 16px;
        border-radius: 10px;
        transition: background 0.3s ease;
    }

    .btn-primary:hover {
        background-color: #009e84;
        border-color: #009e84;
    }
</style>

<div class="message-wrapper">
    <div class="message-title">📩 Check Your Email</div>
    <p>We’ve emailed you instructions for resetting your password.</p>
</div>

{% endblock %}
